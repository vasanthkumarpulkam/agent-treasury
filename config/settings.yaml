treasury:
  starting_capital_usd: 1000
  operating_reserve_pct: 0.15

# Mechanical arbitrage: profit from internally inconsistent prices rather than from
# predicting outcomes. No forecasting skill required -- the edge is arithmetic and is
# verified before the trade is placed. This is the most defensible source of the small,
# repeatable profits the agent needs to cover its rent.
arbitrage:
  enabled: true
  min_profit_pct: 0.02      # require 2% locked profit; must exceed gas + slippage
  max_position_usd: 100     # cap per opportunity
  min_liquidity_usd: 20     # skip opportunities too thin to be worth the execution risk
  scan_markets: 50
  scan_events: 30

# The economics of staying alive. This is what makes the survival mechanic real:
# the agent pays rent every cycle out of a reserve that ONLY profits refill.
survival:
  daily_operating_cost_usd: 1.00   # rent: infra + the cost of existing. Must be earned.
  initial_runway_days: 30          # starting reserve = daily_cost * this. Its grace period.
  charge_llm_spend: true           # real OpenRouter spend is debited from the reserve too

kill_switch:
  max_drawdown_pct: 0.30
  rolling_loss_window_days: 30
  rolling_loss_pct: 0.10
  min_operating_reserve_usd: 0     # death at reserve <= 0 (starvation)
  resurrection_mode: manual

allocation:
  polymarket_weight: 0.5
  bitcoin_weight: 0.5
  rebalance_frequency_days: 7
  per_leg_kill_drawdown_pct: 0.40

position_limits:
  max_single_position_pct: 0.05
  max_daily_notional_pct: 0.20
  max_total_exposure_pct: 0.80

polymarket:
  min_edge_pct: 0.06
  # Only trade markets priced in this band. Outside it, liquidity is thin and a fixed
  # percentage-point edge stops being meaningful (6pp at a price of 0.005 is a 13x claim).
  min_price: 0.05
  max_price: 0.95
  # Cap how far the model may disagree with the market in relative terms. Beyond this,
  # a disagreement is far more likely to be model error than discovered edge.
  max_odds_ratio: 3.0
  # The model reports its own confidence. When it says 0.10 and explains "no information
  # provided, defaulting to market price", believe it -- don't trade that.
  min_llm_confidence: 0.40
  # Don't spend API budget on markets where a language model cannot plausibly know
  # anything. Live runs wasted most of a cycle on Serbian 2nd-division corner counts and
  # Taipei weather, where the model correctly reported it had no information.
  min_volume_usd: 20000
  market_pool_size: 100     # fetch this many, then filter down to max_markets_per_cycle
  exclude_keywords:
    - "O/U"
    - "Exact Score"
    - "Total Corners"
    - "1st Half"
    - "Over/Under"
  kelly_fraction: 0.125
  category_allowlist: []
  market_allowlist: []
  max_markets_per_cycle: 15
  # Model fallback chain, tried in order. Automatically falls through on 402 (out of
  # credit), 404 (model retired), 429 (rate limited) or provider 5xx -- so a dead model
  # or an empty balance degrades the agent instead of silently blinding it.
  # ":free" models cost nothing and don't consume llm_max_spend_per_cycle_usd.
  # Free models first, so the agent keeps reasoning at a $0 OpenRouter balance. Free
  # tiers are also heavily rate-limited (429), which the chain handles by falling
  # through. Verify these still exist before trusting them -- model slugs get retired
  # regularly (gpt-oss-20b:free 404'd here, and claude-3.5-sonnet before it):
  #   curl -s https://openrouter.ai/api/v1/models | grep -o '"id":"[^"]*:free"'
  llm_models:
    - "nvidia/nemotron-3-ultra-550b-a55b:free"   # largest free reasoning model
    - "google/gemma-4-31b-it:free"               # instruction-tuned, reliable JSON
    - "nvidia/nemotron-3-super-120b-a12b:free"
    - "thinkingmachines/inkling:free"
    - "anthropic/claude-sonnet-5"                # paid; used once credit is available
  llm_model: "anthropic/claude-sonnet-5"   # legacy single-model fallback
  llm_max_spend_per_cycle_usd: 0.50
  llm_estimated_cost_per_call_usd: 0.01
  use_debate: false   # Bull/Bear/Judge multi-pass estimation (3x LLM cost per market)

bitcoin:
  symbol: "BTC/USD"
  timeframe: "1h"
  trend_fast_ma: 20
  trend_slow_ma: 100
  vol_lookback: 30
  vol_size_scaling: true
  max_leverage: 1.0
  min_confidence: 0.15

scheduler:
  poll_interval_minutes: 60

logging:
  db_path: "storage/agent_treasury.db"
